<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>JJK: Cursed Technique</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: 'Courier New', sans-serif; }
    
        #webgl-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 2;
            pointer-events: none;
        }

        #ui {
            position: absolute;
            top: 8%;
            width: 100%;
            text-align: center;
            color: #fff;
            pointer-events: none;
            z-index: 10;
        }
        
        h1 { 
            font-size: 2.5rem; margin: 0; letter-spacing: 10px; 
            font-weight: 900; 
            text-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
            background: linear-gradient(to bottom, #fff, #888);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        #technique-name { 
            font-size: 1rem; color: #00ffff; margin-top: 12px; 
            font-weight: bold; letter-spacing: 4px;
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(0, 255, 255, 0.5);
        }

        #video-container {
            position: absolute;
            bottom: 4%;
            left: 50%;
            transform: translateX(-50%) scaleX(-1);
            width: 32vw;
            max-width: 160px;
            height: calc(32vw * 1.77);
            max-height: 284px;
            border: 2px solid rgba(0, 255, 255, 0.4);
            z-index: 5;
            background-color: #050505; 
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }

        video { width: 100%; height: 100%; object-fit: cover; object-position: center 30%; opacity: 0.75; }
        #output_canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 6; }
    </style>
    
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
            }
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
</head>
<body>

    <canvas id="webgl-canvas"></canvas>

    <div id="ui">
        <h1>呪術廻戦</h1>
        <div id="technique-name">NEUTRAL STATE</div>
    </div>

    <div id="video-container">
        <video class="input_video" playsinline></video>
        <canvas id="output_canvas"></canvas>
    </div>

<script type="module">
    import * as THREE from 'three';

    const canvasElementWebGL = document.getElementById('webgl-canvas');
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 0, 55);

    const renderer = new THREE.WebGLRenderer({ 
        canvas: canvasElementWebGL, 
        antialias: false, 
        alpha: true, 
        powerPreference: "high-performance" 
    });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));

    function createPremiumAnimeGlow() {
        const c = document.createElement('canvas');
        c.width = 64; c.height = 64;
        const ctx = c.getContext('2d');
        const grad = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
        grad.addColorStop(0, 'rgba(255,255,255,1.0)');
        grad.addColorStop(0.2, 'rgba(255,255,255,0.85)');
        grad.addColorStop(0.5, 'rgba(255,255,255,0.15)');
        grad.addColorStop(0.85, 'rgba(255,255,255,0.01)'); 
        grad.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, 64, 64);
        return new THREE.CanvasTexture(c);
    }

    const COUNT = 28000; 
    const geometry = new THREE.BufferGeometry();
    const positions = new Float32Array(COUNT * 3);
    const colors = new Float32Array(COUNT * 3);

    const currentPositions = new Float32Array(COUNT * 3);
    const currentColors = new Float32Array(COUNT * 3);
    const targetPositions = new Float32Array(COUNT * 3);
    const targetColors = new Float32Array(COUNT * 3);

    for(let i=0; i<COUNT*3; i++) {
        currentPositions[i] = (Math.random() - 0.5) * 120;
        positions[i] = currentPositions[i];
    }

    geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

    const material = new THREE.PointsMaterial({
        size: window.innerWidth < 600 ? 1.6 : 1.1, 
        map: createPremiumAnimeGlow(),
        vertexColors: true,
        blending: THREE.AdditiveBlending,
        transparent: true,
        depthWrite: false,
        opacity: 0.95
    });

    const particles = new THREE.Points(geometry, material);
    scene.add(particles);

    function getRed(i) {
        if(i < COUNT * 0.15) {
            const r = Math.random() * 11;
            const theta = Math.random() * 6.28; const phi = Math.acos(2 * Math.random() - 1);
            return { x: r * Math.sin(phi) * Math.cos(theta), y: r * Math.sin(phi) * Math.sin(theta), z: r * Math.cos(phi), r: 1.2, g: 0.0, b: 0.0 };
        } else {
            const armCount = 3; const t = ((i - COUNT * 0.15) / (COUNT * 0.85)); 
            const angle = t * 18 + ((i % armCount) * (Math.PI * 2 / armCount));
            const radius = 2 + (t * 40); 
            return { x: radius * Math.cos(angle), y: radius * Math.sin(angle), z: (Math.random() - 0.5) * (10 * t), r: 0.9, g: 0.0, b: 0.0 };
        }
    }

    function getVoid(i) {
        if (i < COUNT * 0.45) { 
            const angle = Math.random() * Math.PI * 2;
            const radVar = 25.0 + (Math.random() - 0.5) * 2.5; 
            return { x: radVar * Math.cos(angle), y: radVar * Math.sin(angle), z: (Math.random() - 0.5) * 3.0, r: 1.5, g: 1.5, b: 1.5 };
        } else {
            const radius = 26 + Math.random() * 85;
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(2 * Math.random() - 1);
            return { x: radius * Math.sin(phi) * Math.cos(theta), y: radius * Math.sin(phi) * Math.sin(theta), z: radius * Math.cos(phi), r: 0.0, g: 0.6, b: 1.5 };
        }
    }

    function getPurple(i) {
        const maxRadius = 13.0;
        const frac = i / COUNT;
        let x, y, z, rColor, gColor, bColor;

        if (frac < 0.035) {
            const r = Math.pow(Math.random(), 2.4) * 1.3;
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(2 * Math.random() - 1);
            x = r * Math.sin(phi) * Math.cos(theta);
            y = r * Math.sin(phi) * Math.sin(theta);
            z = r * Math.cos(phi);

            const intensity = 1.6 + Math.random() * 0.9;
            rColor = intensity;
            gColor = intensity * 0.97;
            bColor = intensity * 1.05;

        } else if (frac < 0.62) {
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(2 * Math.random() - 1);

            const lobe = 1.0
                + 0.35 * Math.sin(theta * 3.0 + phi * 2.0)
                + 0.25 * Math.sin(theta * 5.0 - phi * 3.0 + i * 0.0011)
                + 0.18 * Math.cos(phi * 4.0 + theta * 2.0);

            const u = Math.random();
            const rBase = Math.pow(u, 1.6) * maxRadius * Math.max(0.35, lobe);

            x = rBase * Math.sin(phi) * Math.cos(theta);
            y = rBase * Math.sin(phi) * Math.sin(theta);
            z = rBase * Math.cos(phi);

            const jitter = 1.15;
            x += (Math.random() - 0.5) * jitter;
            y += (Math.random() - 0.5) * jitter;
            z += (Math.random() - 0.5) * jitter;

            const dist = Math.sqrt(x*x + y*y + z*z);
            const ratio = Math.min(dist / maxRadius, 1.0);

            if (Math.random() > ratio * 0.9 + 0.08) {
                const intensity = 0.9 + Math.random() * 0.8;
                rColor = intensity * 0.95;
                gColor = intensity * 0.85;
                bColor = intensity * 1.15;
            } else {
                const pIntensity = 0.5 + Math.random() * 0.9;
                rColor = pIntensity * 0.55;
                gColor = pIntensity * 0.02;
                bColor = pIntensity * 1.25;
            }

        } else if (frac < 0.90) {
            const armCount = 9;
            const arm = i % armCount;
            const t = Math.random();
            const baseAngle = (arm / armCount) * Math.PI * 2 + (Math.random() - 0.5) * 0.6;
            const tiltPhi = Math.acos(2 * ((arm * 0.37 + Math.random() * 0.3) % 1) - 1);
            const filamentLen = maxRadius * (1.3 + Math.random() * 1.1);
            const curl = Math.sin(t * 6.0 + arm) * 2.2 * t;
            const r = t * filamentLen;
            const theta = baseAngle + curl * 0.15;

            x = r * Math.sin(tiltPhi) * Math.cos(theta);
            y = r * Math.sin(tiltPhi) * Math.sin(theta) + curl * 0.6;
            z = r * Math.cos(tiltPhi) + Math.cos(t * 5.0 + arm) * 1.4 * t;

            const fade = 1.0 - t * 0.6;
            const pIntensity = (0.35 + Math.random() * 0.65) * fade;
            rColor = pIntensity * 0.5;
            gColor = 0.0;
            bColor = pIntensity * 1.3;

        } else {
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(2 * Math.random() - 1);
            const r = maxRadius * (1.4 + Math.random() * 1.4);
            x = r * Math.sin(phi) * Math.cos(theta);
            y = r * Math.sin(phi) * Math.sin(theta);
            z = r * Math.cos(phi);

            const pIntensity = 0.25 + Math.random() * 0.5;
            rColor = pIntensity * 0.6;
            gColor = 0.0;
            bColor = pIntensity * 1.2;
        }

        return { x: x, y: y, z: z, r: rColor, g: gColor, b: bColor };
    }

    function getShrine(i) {
        const total = COUNT;
        if (i < total * 0.25) return { x: (Math.random() - 0.5) * 70, y: -16, z: (Math.random() - 0.5) * 70, r: 0.4, g: 0.0, b: 0.0 };
        else if (i < total * 0.45) {
            const px = ((i % 4) < 2 ? 1 : -1) * 12; const pz = ((i % 4) % 2 === 0 ? 1 : -1) * 8;
            return { x: px + (Math.random() - 0.5) * 2, y: -16 + Math.random() * 30, z: pz + (Math.random() - 0.5) * 2, r: 0.3, g: 0.3, b: 0.35 };
        } 
        else if (i < total * 0.65) {
            const t = Math.random() * Math.PI * 2; const rad = Math.random() * 28;
            const curve = Math.pow(rad / 28, 2) * 8; 
            return { x: rad * Math.cos(t), y: 15 - curve + (Math.random() * 1.5), z: rad * Math.sin(t) * 0.6, r: 0.8, g: 0.0, b: 0.0 };
        } 
        else if (i < total * 0.85) {
            return { x: (Math.random() - 0.5) * 90, y: -16 + Math.random() * 45, z: (Math.random() - 0.5) * 90, r: 0.45, g: 0.0, b: 0.0 };
        }
        else {
            const rIdx = i % 3; const radius = rIdx === 0 ? 18 : rIdx === 1 ? 32 : 46;
            const angle = (i / total) * Math.PI * 60;
            return { x: radius * Math.cos(angle), y: rIdx === 0 ? -5 : rIdx === 1 ? 4 : 14, z: radius * Math.sin(angle), r: 1.2, g: 0.0, b: 0.0 };
        }
    }

    let currentTech = 'neutral';
    let targetTech = 'neutral';
    let gestureLockTimer = 0;
    const GESTURE_COOLDOWN = 350; 

    const videoElement = document.querySelector('.input_video');
    const canvasElement = document.getElementById('output_canvas');
    const canvasCtx = canvasElement.getContext('2d');
    let glowColor = '#00ffff';

    const hands = new window.Hands({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`});
    hands.setOptions({ maxNumHands: 1, modelComplexity: 0, minDetectionConfidence: 0.75 });

    hands.onResults((results) => {
        canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
        let detected = 'neutral';

        if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
            const lm = results.multiHandLandmarks[0];
            window.drawConnectors(canvasCtx, lm, window.HAND_CONNECTIONS, {color: glowColor, lineWidth: 4});
            window.drawLandmarks(canvasCtx, lm, {color: '#fff', lineWidth: 1, radius: 2});

            const isUp = (t, p) => lm[t].y < lm[p].y;
            const pinch = Math.hypot(lm[8].x - lm[4].x, lm[8].y - lm[4].y);
            
            if (pinch < 0.045) detected = 'purple';
            else if (isUp(8,6) && isUp(12,10) && isUp(16,14) && isUp(20,18)) detected = 'shrine';
            else if (isUp(8,6) && isUp(12,10) && !isUp(16,14)) detected = 'void';
            else if (isUp(8,6) && !isUp(12,10)) detected = 'red';
        }
        targetTech = detected;
    });

    function updateState(tech) {
        currentTech = tech;
        const nameEl = document.getElementById('technique-name');

        if(tech === 'shrine') { glowColor = '#ff0000'; nameEl.innerText = "Domain Expansion: Malevolent Shrine"; }
        else if(tech === 'purple') { glowColor = '#bb00ff'; nameEl.innerText = "Secret Technique: Hollow Purple"; }
        else if(tech === 'void') { glowColor = '#00ffff'; nameEl.innerText = "Domain Expansion: Infinite Void"; }
        else if(tech === 'red') { glowColor = '#ff3333'; nameEl.innerText = "Reverse Cursed Technique: Red"; }
        else { glowColor = '#00ffff'; nameEl.innerText = "Neutral State"; }

        for(let i=0; i<COUNT; i++) {
            let p;
            if(tech === 'neutral') {
                if(i < COUNT * 0.12) {
                    const r = 10 + Math.random()*15; const t = Math.random()*6.28; const ph = Math.random()*3.14;
                    p = { x: r*Math.sin(ph)*Math.cos(t), y: r*Math.sin(ph)*Math.sin(t), z: r*Math.cos(ph), r: 0.1, g: 0.4, b: 0.7 };
                } else p = { x:0, y:0, z:0, r:0, g:0, b:0 };
            }
            else if(tech === 'red') p = getRed(i);
            else if(tech === 'void') p = getVoid(i);
            else if(tech === 'purple') p = getPurple(i);
            else if(tech === 'shrine') p = getShrine(i);
            
            targetPositions[i*3] = p.x; targetPositions[i*3+1] = p.y; targetPositions[i*3+2] = p.z;
            targetColors[i*3] = p.r; targetColors[i*3+1] = p.g; targetColors[i*3+2] = p.b;
        }
    }

    const cameraUtils = new window.Camera(videoElement, {
        onFrame: async () => {
            if (videoElement.readyState >= 2) {
                canvasElement.width = videoElement.videoWidth || 640;
                canvasElement.height = videoElement.videoHeight || 480;
                await hands.send({image: videoElement});
            }
        }, 
        width: 640, 
        height: 480
    });
    cameraUtils.start().catch(err => console.error(err));

    const clock = new THREE.Clock();

    function animate() {
        requestAnimationFrame(animate);
        const dt = clock.getDelta();
        const time = clock.getElapsedTime();

        if (targetTech !== currentTech) {
            gestureLockTimer += dt * 1000;
            if (gestureLockTimer >= GESTURE_COOLDOWN) {
                updateState(targetTech);
                gestureLockTimer = 0;
            }
        } else { gestureLockTimer = 0; }

        const pos = particles.geometry.attributes.position.array;
        const col = particles.geometry.attributes.color.array;

        for(let i=0; i<COUNT*3; i++) {
            currentPositions[i] += (targetPositions[i] - currentPositions[i]) * 0.15;
            pos[i] = currentPositions[i];
            col[i] += (targetColors[i] - col[i]) * 0.15;
        }

        if (currentTech === 'shrine') {
            for (let i = Math.floor(COUNT * 0.65); i < Math.floor(COUNT * 0.85); i++) {
                const i3 = i * 3;
                currentPositions[i3+1] += dt * 7.5; 
                currentPositions[i3] += Math.sin(time * 3.5 + i) * 0.08;
                currentPositions[i3+2] += Math.cos(time * 2.5 + i) * 0.08;
                
                if (currentPositions[i3+1] > 26) { 
                    currentPositions[i3+1] = -16;
                    currentPositions[i3] = (Math.random() - 0.5) * 90;
                    currentPositions[i3+2] = (Math.random() - 0.5) * 90;
                }
                pos[i3] = currentPositions[i3];
                pos[i3+1] = currentPositions[i3+1];
                pos[i3+2] = currentPositions[i3+2];
            }

            for (let i = Math.floor(COUNT * 0.85); i < COUNT; i++) {
                const i3 = i * 3;
                const rIdx = i % 3;
                const speed = rIdx === 0 ? 1.4 : rIdx === 1 ? -0.8 : 2.0; 
                const delta = speed * dt;

                const x = currentPositions[i3];
                const z = currentPositions[i3+2];
                currentPositions[i3] = x * Math.cos(delta) - z * Math.sin(delta);
                currentPositions[i3+2] = x * Math.sin(delta) + z * Math.cos(delta);
                
                pos[i3] = currentPositions[i3];
                pos[i3+2] = currentPositions[i3+2];
            }

            const pulse = 1.0 + Math.sin(time * 4.0) * 0.04;
            for (let i = 0; i < Math.floor(COUNT * 0.65); i++) {
                const i3 = i * 3;
                pos[i3] *= pulse;
                pos[i3+2] *= pulse;
            }
        }
        
        if (currentTech === 'purple') {
            const purpleMaxR = 13.0;
            const coreEnd = Math.floor(COUNT * 0.035);
            const plasmaEnd = Math.floor(COUNT * 0.62);
            const wispEnd = Math.floor(COUNT * 0.90);

            for (let i = 0; i < COUNT; i++) {
                const i3 = i * 3;

                let px = currentPositions[i3];
                let py = currentPositions[i3+1];
                let pz = currentPositions[i3+2];

                if (i < coreEnd) {
                    const jitter = 0.15;
                    px += (Math.random() - 0.5) * jitter;
                    py += (Math.random() - 0.5) * jitter;
                    pz += (Math.random() - 0.5) * jitter;

                } else if (i < plasmaEnd) {
                    const swirlSpeed = 6.5;
                    const turbulence = 0.16;
                    px += Math.cos(time * swirlSpeed + py * 0.6 + i * 0.13) * turbulence;
                    py += Math.sin(time * (swirlSpeed * 0.85) + px * 0.6 + i * 0.11) * turbulence;
                    pz += Math.cos(time * (swirlSpeed * 1.15) + pz * 0.6 + i * 0.09) * turbulence;

                    const dist = Math.sqrt(px*px + py*py + pz*pz) || 0.0001;
                    const pullStrength = 0.02 * (dist / purpleMaxR);
                    px -= (px / dist) * pullStrength;
                    py -= (py / dist) * pullStrength;
                    pz -= (pz / dist) * pullStrength;

                    const breath = 1.0 + Math.sin(time * 3.0 + i * 0.02) * 0.03;
                    px *= breath;
                    py *= breath;
                    pz *= breath;

                } else if (i < wispEnd) {
                    const whip = 0.12;
                    px += Math.sin(time * 4.0 + i * 0.2) * whip;
                    py += Math.cos(time * 3.3 + i * 0.17) * whip;
                    pz += Math.sin(time * 3.8 + i * 0.23) * whip;

                } else {
                    const dist = Math.sqrt(px*px + py*py + pz*pz) || 0.0001;
                    const speed = 6.0 + (i % 7);
                    const inwardStep = speed * dt;
                    const nx = px - (px / dist) * inwardStep;
                    const ny = py - (py / dist) * inwardStep;
                    const nz = pz - (pz / dist) * inwardStep;
                    const newDist = Math.sqrt(nx*nx + ny*ny + nz*nz);

                    if (newDist < 1.8 || newDist > dist) {
                        const theta = Math.random() * Math.PI * 2;
                        const phi = Math.acos(2 * Math.random() - 1);
                        const r = purpleMaxR * (1.4 + Math.random() * 1.4);
                        px = r * Math.sin(phi) * Math.cos(theta);
                        py = r * Math.sin(phi) * Math.sin(theta);
                        pz = r * Math.cos(phi);
                    } else {
                        px = nx;
                        py = ny;
                        pz = nz;
                    }
                }

                currentPositions[i3] = px;
                currentPositions[i3+1] = py;
                currentPositions[i3+2] = pz;
                pos[i3] = px;
                pos[i3+1] = py;
                pos[i3+2] = pz;
            }
        }

        particles.geometry.attributes.position.needsUpdate = true;
        particles.geometry.attributes.color.needsUpdate = true;
        
        if(currentTech === 'red') { 
            particles.rotation.set(0, 0, particles.rotation.z - 0.12); 
        } 
        else if (currentTech === 'purple') { 
            particles.rotation.set(
                particles.rotation.x + 0.02, 
                particles.rotation.y + 0.05, 
                particles.rotation.z + 0.03
            ); 
        } 
        else if (currentTech === 'void') {
            particles.rotation.set(0, particles.rotation.y + 0.02, 0);
        }
        else if (currentTech === 'shrine') { 
            particles.rotation.set(0, 0, 0); 
        } 
        else { 
            particles.rotation.set(0, particles.rotation.y + 0.006, 0); 
        }

        renderer.render(scene, camera);
    }
    
    updateState('neutral');
    animate();

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
</script>
</body>
</html>
